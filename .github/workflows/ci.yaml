name: Django compatibility

on: [push, pull_request, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: online_competitions.settings_ci
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      FAKTURY_API_KEY: ci-only-not-for-deployment
      EMAIL_PASSWORD: ci-only-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py test --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - name: Build deployment image
        run: docker build --tag strom-compatibility .
